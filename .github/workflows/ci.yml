name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      # Fails the build on high/critical vulnerabilities in what ships to production
      # (OWASP A06, see SECURITE.md). Scoped to --omit=dev: the remaining dev-only chain
      # (eslint's own bundled minimatch/brace-expansion) has no fix that doesn't break
      # eslint-plugin-jsx-a11y's peer range (eslint ^9 max) — tracked in MAINTENANCE.md §6.
      - run: npm audit --omit=dev --audit-level=high
      # SWC (Vite's transpiler) does not check types — this is the only gate that does.
      - run: npm run typecheck
      - run: npm run lint
      # `test:coverage` runs the full suite (same pass/fail as `npm test`) and
      # additionally produces the coverage report uploaded below.
      - run: npm run test:coverage
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
